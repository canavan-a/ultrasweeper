; scanner firmware — police scanner (see ../PLAN.md, protocol in ../PROTOCOL.md).
;
; One environment, scanner-usb: nRF24L01+ module(s) receive BLE
; advertising directly (every BLE ADV uses the fixed access address
; 0x8E89BED6 @1M GFSK, which an nRF24 can demodulate). With
; SCANNER_RADIOS=2, radio A hops BLE adv channels 37<->39 (nRF 2<->80)
; while radio B holds 38 (nRF 26); with SCANNER_RADIOS=1, one module
; cycles 37->38->39 — every adv event repeats on all three channels,
; so a single fast hopper still hears every advertiser. Records go out
; UART0 to the onboard USB bridge; the phone (or a laptop) is the USB
; host. The ESP32's own radios are torn down at boot: the device emits
; no RF.
;
; nRF24 channel n is 2400+n MHz; BLE advertising sits on nRF 2, 26, 80
; (same mapping as the jammer's platformio.ini comments).
;
; Wiring lives here, not in the sources. See ../mappings.md for the
; nRF24L01 <-> ESP32 hookup.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
	nrf24/RF24@^1.6.2

[env:scanner-usb]
build_flags =
	; Both radios share the VSPI bus (SCK 18, MISO 19, MOSI 23 — the
	; ESP32 defaults); only CE/CSN differ per module.
	-DSCANNER_A_CE=4
	-DSCANNER_A_CSN=5
	; Radio count. 1 = single module: radio A hops all three adv
	; channels (37->38->39). BLE repeats every advertisement on all
	; three channels within ~2 ms of each other, so one fast hopper
	; hears every advertiser; 2 = A hops 37<->39 while B holds 38.
	; Currently 1: bench module B never answers SPI (all-FF reads
	; with two different modules = wiring fault), and one module
	; also halves the power inrush behind the boot-loop.
	-DSCANNER_RADIOS=1
	; Radio B control lines (used only when SCANNER_RADIOS=2).
	; Deliberately NOT strapping pins: B's old CSN on GPIO15 (MTDO,
	; pulldown at boot) puts the module on the shared MISO line
	; during boot and garbles both radios' SPI.
	-DSCANNER_B_CE=21
	-DSCANNER_B_CSN=22
	; BLE advertising channels the two radios cover. A hops between
	; BLE_CH_A1 and BLE_CH_A2; B stays on BLE_CH_B. nRF channel =
	; BLE frequency - 2400, so 37->2, 38->26, 39->80.
	-DSCANNER_A_CH1=37
	-DSCANNER_A_CH2=39
	-DSCANNER_B_CH=38
	; How long radio A dwells on each of its two channels (ms). Must
	; exceed the ~130 us PLL settle; 6 ms keeps A on a channel longer
	; than the ~1.5 ms inter-channel gap of one advertising event.
	-DSCANNER_HOP_MS=6
	; Record output: batch window for BATCH-START/END framing (ms) and
	; stats line interval (ms).
	-DSCANNER_BATCH_MS=2000
	-DSCANNER_STATS_MS=10000
	; On-device dedup (transport hygiene only, see PROTOCOL.md):
	; re-report a MAC at most every SCANNER_DEDUP_MS unless its PWR
	; reading changed.
	-DSCANNER_DEDUP_MS=5000
	; PIR presence sensor input (HC-SR501 class). -1 disables the PIR
	; record type entirely.
	-DSCANNER_PIR_PIN=27
	; Diagnostic bring-up switch. 1 = promiscuous mode: address width
	; 2 (accept nearly any framed energy, like the RF24 library's
	; scanner example), and emit up to 200 RAW records for blobs that
	; look like BLE PDUs so captures can be decoded by hand. Set 0
	; for normal operation.
	-DSCANNER_DIAG=1
	; UART baud for the record stream. 921600 is reliable on CP2102/
	; CH340 bridges and keeps full-PDU records flowing under load.
	-DSCANNER_BAUD=921600
