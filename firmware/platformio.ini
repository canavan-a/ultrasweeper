; ultrasweeper firmware.
;
; Three environments over one PlatformIO project:
;   sweeper   - the device: two nRF24L01s on both ESP32 SPI buses,
;               constant-carrier-sweeping disjoint 2.4 GHz channel ranges
;   listener  - reference sketch: receive and print packets
;   publisher - reference sketch: send packets once a second
;
; Wiring lives here, not in the sources. See ../mappings.md for the
; nRF24L01 <-> ESP32 hookup.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	nrf24/RF24@^1.6.2

[env:sweeper]
build_src_filter = +<*> -<listener.cpp> -<publisher.cpp>
build_flags =
	; Radio A on VSPI, Radio B on HSPI (pins from mappings.md).
	-DSWEEPER_A_CE=4
	-DSWEEPER_A_CSN=5
	-DSWEEPER_A_SCK=18
	-DSWEEPER_A_MISO=19
	-DSWEEPER_A_MOSI=23
	-DSWEEPER_B_CE=2
	-DSWEEPER_B_CSN=15
	-DSWEEPER_B_SCK=14
	-DSWEEPER_B_MISO=12
	-DSWEEPER_B_MOSI=13
	; Channel ranges each radio hops; kept disjoint so the carriers never
	; overlap. nRF24 channels are 2400+ch MHz at 2 Mbps.
	-DSWEEPER_A_CHANNEL_LOW=40
	-DSWEEPER_A_CHANNEL_HIGH=59
	-DSWEEPER_B_CHANNEL_LOW=60
	-DSWEEPER_B_CHANNEL_HIGH=79

[env:listener]
build_flags =
	-DLISTENER_CE=4
	-DLISTENER_CSN=5
build_src_filter = -<*> +<listener.cpp>

[env:publisher]
build_flags =
	-DPUBLISHER_CE=4
	-DPUBLISHER_CSN=5
build_src_filter = -<*> +<publisher.cpp>
