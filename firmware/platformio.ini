; ultrasweeper firmware.
;
; Three environments over one PlatformIO project:
;   sweeper     - the device: two nRF24L01s on both ESP32 SPI buses,
;                 constant-carrier-sweeping disjoint 2.4 GHz channel ranges
;   sweeper-low - the same firmware for the second device, covering the
;                 lower BLE ranges so the two devices together span
;                 nRF 0-78 = 2400-2478 MHz, the whole BLE band (all 37
;                 data channels + adv 2402/2426; adv 2480 is nRF 80)
;   listener    - reference sketch: receive and print packets
;   publisher   - reference sketch: send packets once a second
;
; nRF24 channel n is 2400+n MHz at 2 Mbps; BLE data channels sit on even
; nRF channels 4-76, BLE advertising on 2, 26 and 80. The odd guard
; channels 19/39/59 sit between ranges and carry nothing (no BLE channel
; uses them). Other ranges from earlier experiments, kept for reference:
;   100-120 (2500-2518), 120-126 (2520-2526), 70-100 (2470-2498).
;
; Wiring lives here, not in the sources. See ../mappings.md for the
; nRF24L01 <-> ESP32 hookup.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	nrf24/RF24@^1.6.2

# Both sweeper devices share identical wiring (mappings.md); only the
# channel ranges differ.
[env:sweeper]
build_src_filter = +<*> -<listener.cpp> -<publisher.cpp>
build_flags =
	; Radio A on VSPI, Radio B on HSPI (pins from mappings.md).
	-DSWEEPER_A_CE=4
	-DSWEEPER_A_CSN=5
	-DSWEEPER_A_SCK=18
	-DSWEEPER_A_MISO=19
	-DSWEEPER_A_MOSI=23
	-DSWEEPER_B_CE=2
	-DSWEEPER_B_CSN=15
	-DSWEEPER_B_SCK=14
	-DSWEEPER_B_MISO=12
	-DSWEEPER_B_MOSI=13
	; Channel ranges each radio hops; kept disjoint so the carriers never
	; overlap. nRF24 channels are 2400+ch MHz at 2 Mbps. HIGH is exclusive
	; (Arduino random(low, high)). B runs up to 80 so the sweep includes
	; BLE's third advertising channel (2480); together the two devices
	; cover nRF 0-80, the entire BLE band.
	-DSWEEPER_A_CHANNEL_LOW=40
	-DSWEEPER_A_CHANNEL_HIGH=59
	-DSWEEPER_B_CHANNEL_LOW=60
	-DSWEEPER_B_CHANNEL_HIGH=81

; The second device: lower half of the BLE band. Same wiring as above.
[env:sweeper-low]
extends = env:sweeper
build_flags =
	-DSWEEPER_A_CE=4
	-DSWEEPER_A_CSN=5
	-DSWEEPER_A_SCK=18
	-DSWEEPER_A_MISO=19
	-DSWEEPER_A_MOSI=23
	-DSWEEPER_B_CE=2
	-DSWEEPER_B_CSN=15
	-DSWEEPER_B_SCK=14
	-DSWEEPER_B_MISO=12
	-DSWEEPER_B_MOSI=13
	-DSWEEPER_A_CHANNEL_LOW=0
	-DSWEEPER_A_CHANNEL_HIGH=19
	-DSWEEPER_B_CHANNEL_LOW=20
	-DSWEEPER_B_CHANNEL_HIGH=39

[env:listener]
build_flags =
	-DLISTENER_CE=4
	-DLISTENER_CSN=5
build_src_filter = -<*> +<listener.cpp>

[env:publisher]
build_flags =
	-DPUBLISHER_CE=4
	-DPUBLISHER_CSN=5
build_src_filter = -<*> +<publisher.cpp>
